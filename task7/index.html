<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лента постов</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Лента постов</h1>
    <input
      id="search"
      class="search"
      type="search"
      placeholder="Поиск по заголовку…"
      autocomplete="off"
    >
  </header>

  <main class="container">
    <div id="posts" class="posts"></div>

    <p id="empty-message" class="status hidden">Ничего не найдено.</p>
    <p id="loader" class="status hidden"><span class="spinner"></span>Загрузка…</p>
    <div id="error-block" class="error hidden">
      <p id="error-message"></p>
      <button id="retry" type="button">Повторить</button>
    </div>
    <p id="end-message" class="status hidden">Больше постов нет.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
