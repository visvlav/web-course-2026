<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёт финансов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Учёт финансов</h1>
    </header>

    <main>
        <section>
            <h2>Добавить операцию</h2>

            <form id="transaction-form" novalidate>
                <label>
                    Сумма
                    <input type="number" id="amount" min="0.01" step="0.01" required>
                </label>

                <label>
                    Категория
                    <select id="category" required></select>
                </label>

                <label>
                    Дата
                    <input type="date" id="date" required>
                </label>

                <label>
                    Комментарий
                    <input type="text" id="comment">
                </label>

                <button type="submit">Добавить</button>
            </form>
        </section>
        <section>
            <h2>Создать категорию</h2>

            <form id="category-form" novalidate>
                <label>
                    Название категории
                    <input type="text" id="category-name" required>
                </label>

                <label>
                    Тип категории
                    <select id="category-type" required>
                        <option value="expense">Расход</option>
                        <option value="income">Доход</option>
                    </select>
                </label>

                <button type="submit">Создать категорию</button>
            </form>
        </section>
        <section>
            <h2>Фильтры</h2>

            <label>
                Тип операции
                <select id="type-filter">
                    <option value="">Все</option>
                    <option value="income">Доходы</option>
                    <option value="expense">Расходы</option>
                </select>
            </label>

            <label>
                Категория
                <select id="category-filter">
                    <option value="">Все категории</option>
                </select>
            </label>

            <label>
                С даты
                <input type="date" id="from-filter">
            </label>

            <label>
                По дату
                <input type="date" id="to-filter">
            </label>

            <button id="filter-button" type="button">Применить фильтры</button>
            <button id="reset-filters" type="button">Сбросить</button>
        </section>

        <section>
    <h2>Редактировать операцию</h2>

    <form id="edit-form" hidden novalidate>
        <label>
            Сумма
            <input type="number" id="edit-amount" min="0.01" step="0.01" required>
        </label>

        <label>
            Категория
            <select id="edit-category" required></select>
        </label>

        <label>
            Дата
            <input type="date" id="edit-date" required>
        </label>

        <label>
            Комментарий
            <input type="text" id="edit-comment">
        </label>

        <button type="submit">Сохранить изменения</button>
        <button type="button" id="cancel-edit">Отмена</button>
    </form>
</section>

<section>
    <h2>Операции</h2>
    <div id="summary"></div>
    <div id="transactions-list"></div>
</section>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
