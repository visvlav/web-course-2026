<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zen-Money</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>Zen-Money</h1>
    <button id="theme-toggle" type="button" class="btn btn-ghost">Тема</button>
  </header>

  <main class="container">
    <div id="message" class="message hidden" role="alert"></div>

    <section class="card summary" id="summary">
      <div>Доходы: <strong id="sum-income" class="income">0</strong></div>
      <div>Расходы: <strong id="sum-expense" class="expense">0</strong></div>
      <div>Баланс: <strong id="sum-balance">0</strong></div>
    </section>

    <section class="card">
      <h2 id="form-title">Новая операция</h2>
      <form id="transaction-form" novalidate>
        <div class="grid">
          <label>Сумма
            <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" />
          </label>
          <label>Тип
            <select id="type">
              <option value="expense">Расход</option>
              <option value="income">Доход</option>
            </select>
          </label>
          <label>Категория
            <select id="category"></select>
          </label>
          <label>Дата
            <input type="date" id="date" />
          </label>
        </div>
        <label>Комментарий
          <input type="text" id="comment" placeholder="Необязательно" />
        </label>
        <div class="actions">
          <button type="submit" id="submit-btn" class="btn">Добавить</button>
          <button type="button" id="cancel-btn" class="btn btn-ghost hidden">Отмена</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Новая категория</h2>
      <form id="category-form" class="inline" novalidate>
        <input type="text" id="cat-name" placeholder="Название" />
        <select id="cat-type">
          <option value="expense">Расход</option>
          <option value="income">Доход</option>
        </select>
        <button type="submit" class="btn">Создать</button>
      </form>
    </section>

    <section class="card">
      <h2>Фильтры</h2>
      <form id="filters-form" class="grid">
        <label>Категория
          <select id="f-category"></select>
        </label>
        <label>Тип
          <select id="f-type">
            <option value="">Все</option>
            <option value="income">Доходы</option>
            <option value="expense">Расходы</option>
          </select>
        </label>
        <label>С даты
          <input type="date" id="f-from" />
        </label>
        <label>По дату
          <input type="date" id="f-to" />
        </label>
      </form>
      <button type="button" id="reset-filters" class="btn btn-ghost">Сбросить</button>
    </section>

    <section class="card">
      <h2>Операции</h2>
      <p id="empty" class="hidden muted">Операций нет</p>
      <table id="table">
        <thead>
          <tr>
            <th>Дата</th><th>Категория</th><th>Комментарий</th><th>Сумма</th><th></th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </section>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
