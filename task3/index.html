<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo-list</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>Список задач</h1>

    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Новая задача..." autocomplete="off">
      <button id="addBtn">Добавить</button>
    </div>
    <div id="warning" class="warning"></div>

    <div class="counter" id="counter">Осталось: 0, Выполнено: 0</div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="active">Активные</button>
      <button class="filter-btn" data-filter="completed">Завершённые</button>
    </div>

    <ul id="taskList" class="task-list"></ul>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
