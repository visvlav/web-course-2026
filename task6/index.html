<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Змейка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1 class="game__title">Змейка</h1>
    <p class="game__score">Счёт: <span id="score">0</span></p>
    <canvas id="game-canvas" width="400" height="400"></canvas>
    <button id="restart-btn" class="game__restart" type="button" hidden>Начать заново</button>
    <p class="game__hint">Управление: стрелки на клавиатуре</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
