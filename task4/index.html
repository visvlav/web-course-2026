<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Быки и коровы</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1> Быки и коровы </h1>
    <p class="rules">
      Компьютер загадал 4 цифры без повторов. Введите 4 разные цифры и нажмите «Проверить».
    </p>

    <!-- Счётчик попыток по центру -->
    <div class="counter">
      <span class="counter-label">Попыток</span>
      <span class="counter-value" id="attemptsCount">0</span>
    </div>

    <div class="controls">
      <input
        type="text"
        id="guessInput"
        maxlength="4"
        placeholder="1234"
        autocomplete="off"
        inputmode="numeric"
      >
      <button id="checkBtn">Проверить</button>
      <button id="newGameBtn">Новая игра</button>
    </div>

    <!-- Чекбокс "подсмотреть" -->
    <label class="peek">
      <input type="checkbox" id="peekCheckbox">
      <span>Подсмотреть загаданное число</span>
    </label>

    <p id="secretView" class="secret-view"></p>

    <p id="message" class="message"></p>

    <h2>История</h2>
    <ul id="historyList" class="history"></ul>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
